[project]
name = "solargraf-server"
version = "0.7.1"
description = "SolarGraf (nazwa robocza) — server"
requires-python = ">=3.12,<3.13"
license = "LicenseRef-Proprietary"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "cryptography>=46",
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.2",
    "solargraf-profiles",
    "sqlalchemy[asyncio]>=2.1.8",
    "tzdata>=2026.6",
    "uvicorn>=0.54.0",
]

[tool.uv.sources]
solargraf-profiles = { workspace = true }

[project.scripts]
solargraf-admin = "solargraf_server.cli:main"
solargraf-worker = "solargraf_server.worker:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"
