# Wszystkie hooki są lokalne: używają wersji narzędzi przypiętych w uv.lock i package-lock.json.
# Instalacja (oba etapy naraz): uv run pre-commit install
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types: [python]
      - id: mypy
        name: mypy --strict
        entry: uv run --frozen mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: web-lint
        name: oxlint (web)
        entry: npm --prefix web run lint
        language: system
        files: ^web/
        pass_filenames: false
      - id: web-typecheck
        name: tsc (web)
        entry: npm --prefix web run typecheck
        language: system
        files: ^web/
        pass_filenames: false
      - id: no-secrets-files
        name: blokada plików z sekretami
        entry: pliki .env, .pem i .key nie mogą trafić do repozytorium
        language: fail
        files: (^|/)(\.env(\..+)?|.*\.pem|.*\.key)$
        exclude: (^|/)\.env\.example$

      # --- pre-push: lokalna ochrona main (GitHub bez Pro nie chroni gałęzi prywatnych) ---
      - id: no-push-to-main
        name: blokada pushu na main
        entry: uv run --frozen python -m tools.hooks.no_push_to_main
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run --frozen pytest -q
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
      - id: web-test
        name: vitest (web)
        entry: npm --prefix web test
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
      - id: licenses-python
        name: licencje zależności (Python)
        entry: uv run --frozen python tools/check_licenses.py python
        language: system
        stages: [pre-push]
        files: ^(uv\.lock|pyproject\.toml|server/pyproject\.toml|agent/pyproject\.toml|profiles-schema/pyproject\.toml|tools/license-policy\.json)$
        pass_filenames: false
      - id: licenses-npm
        name: licencje zależności (npm)
        entry: uv run --frozen python tools/check_licenses.py npm
        language: system
        stages: [pre-push]
        files: ^(web/package(-lock)?\.json|tools/license-policy\.json)$
        pass_filenames: false
