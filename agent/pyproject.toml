[project]
name = "solargraf-agent"
version = "0.3.0"
description = "SolarGraf (nazwa robocza) — agent"
requires-python = ">=3.12,<3.13"
license = "LicenseRef-Proprietary"
dependencies = [
    "solargraf-profiles",
    "pymodbus==3.16.2",
    "httpx2>=2.16.0",
]

[tool.uv.sources]
solargraf-profiles = { workspace = true }

[project.scripts]
solargraf-agent = "solargraf_agent.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"
