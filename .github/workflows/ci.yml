name: CI

on:
  push:
    branches: [main]
  pull_request:

# Akcje przypięte do SHA commita (komentarz = wersja). Aktualizacja: nowe SHA z wydania danej akcji.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python — lint, typy, testy, licencje, SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-trixie
        env:
          POSTGRES_DB: solargraf
          POSTGRES_USER: solargraf
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U solargraf -d solargraf"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      SOLARGRAF_TEST_DB: "1"
      SOLARGRAF_DB_HOST: localhost
      SOLARGRAF_DB_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
      - name: Instalacja zależności (lockfile)
        run: uv sync --locked
      - name: ruff format
        run: uv run --frozen ruff format --check .
      - name: ruff check
        run: uv run --frozen ruff check .
      - name: mypy --strict
        run: uv run --frozen mypy
      - name: pytest (w tym testy z PostgreSQL)
        run: uv run --frozen pytest
      - name: Kontrola licencji (zależności produkcyjne)
        run: uv run --frozen python tools/check_licenses.py python
      - name: SBOM (CycloneDX, zależności produkcyjne)
        run: |
          uv export --no-dev --no-hashes --frozen --no-emit-workspace > requirements-prod.txt
          uv run --frozen cyclonedx-py requirements requirements-prod.txt -o sbom-python.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-python
          path: sbom-python.cdx.json

  web:
    name: Web — lint, typy, testy, build, licencje, SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Kontrola licencji (zależności produkcyjne)
        working-directory: .
        run: uv run --frozen --no-dev python tools/check_licenses.py npm
      - name: SBOM (CycloneDX, zależności produkcyjne)
        run: npm run --silent sbom > sbom-web.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-web
          path: web/sbom-web.cdx.json

  compose:
    name: Compose — db, migrate, api, health
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Hasło bazy tylko dla tego przebiegu
        run: echo "SOLARGRAF_DB_PASSWORD=$(openssl rand -hex 24)" > deploy/.env
      - name: Start
        run: docker compose -f deploy/compose.dev.yaml up -d --build
      - name: Gotowość API (200)
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/health/ready || true)
            [ "$code" = "200" ] && exit 0
            sleep 2
          done
          echo "API nie osiągnęło gotowości (ostatni kod: $code)"; exit 1
      - name: Migracja zakończona sukcesem
        run: |
          test "$(docker inspect -f '{{.State.ExitCode}}' "$(docker compose -f deploy/compose.dev.yaml ps -a -q migrate)")" = "0"
      - name: Baza bez portu na hoście
        run: |
          published="$(docker port "$(docker compose -f deploy/compose.dev.yaml ps -q db)")"
          echo "Opublikowane porty db: '${published}'"
          test -z "$published"
      - name: Bez bazy — 503, liveness nadal 200
        run: |
          docker compose -f deploy/compose.dev.yaml stop db
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/health/ready)" = "503"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/health)" = "200"
      - name: Kontener API jako użytkownik nieuprzywilejowany
        run: test "$(docker compose -f deploy/compose.dev.yaml exec -T api id -u)" = "10001"
      - name: Logi
        if: always()
        run: docker compose -f deploy/compose.dev.yaml logs --no-color
      - name: Sprzątanie
        if: always()
        run: docker compose -f deploy/compose.dev.yaml down -v

  installer:
    name: Instalator — ShellCheck, dry-run, instalacja, link konfiguracji
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash # -eo pipefail
    env:
      DIR: /opt/solargraf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ShellCheck (narzędzie tylko w CI, GPL-3.0 — patrz COMPLIANCE.md)
        run: shellcheck deploy/install.sh tools/make-bundle.sh
      - name: Paczka z git archive
        run: |
          ./tools/make-bundle.sh
          mkdir -p /tmp/bundle && tar -xzf dist/solargraf-*.tar.gz -C /tmp/bundle
          test -x /tmp/bundle/solargraf/deploy/install.sh
          test -s /tmp/bundle/solargraf/VERSION
          if grep -rl $'\r' /tmp/bundle/solargraf/deploy; then echo 'Niespełniony warunek'; exit 1; fi
      - name: --dry-run na czystych systemach (Debian 12/13, Ubuntu 24.04/26.04)
        run: |
          for img in debian:12 debian:13 ubuntu:24.04 ubuntu:26.04; do
            echo "::group::$img"
            docker run --rm -v /tmp/bundle/solargraf:/src:ro "$img" bash /src/deploy/install.sh install --dry-run
            echo "::endgroup::"
          done
      - name: Lokalny serwer archiwum w formacie codeload GitHuba (zamiast pobierania z sieci)
        run: |
          mkdir -p /tmp/srv
          git -c core.autocrlf=false archive --format=tar.gz --prefix=solargraf-main/ -o /tmp/srv/src.tar.gz HEAD
          (python3 -m http.server 8765 --bind 127.0.0.1 -d /tmp/srv >/tmp/srv.log 2>&1 &)
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:8765/src.tar.gz && exit 0; sleep 1; done
          exit 1
      - name: --dry-run niczego nie zmienia (z paczki i przez potok)
        run: |
          sudo /tmp/bundle/solargraf/deploy/install.sh install --dry-run
          sudo bash -s install --dry-run < deploy/install.sh | tee dry-pipe.txt
          grep -q 'codeload.github.com/arkadiuszbaglaj/solargraf/tar.gz/main' dry-pipe.txt
          test ! -e "$DIR"
      - name: Źródło kodu tylko przez HTTPS
        run: |
          if sudo SOLARGRAF_SOURCE_URL=http://example.com/x.tar.gz bash -s install --yes < deploy/install.sh; then exit 1; fi
          sudo rm -rf "$DIR"
      - name: Instalacja przez potok (jak curl | sudo bash)
        run: |
          sudo SOLARGRAF_SOURCE_URL=http://127.0.0.1:8765/src.tar.gz bash -s install --yes < deploy/install.sh | tee install-out.txt
          grep -q 'Pobieram kod' install-out.txt
          test "$(cat "$DIR/src/VERSION")" = "github:main"
      - name: Sekrety i log
        run: |
          test "$(sudo stat -c %a "$DIR/.env")" = "600"
          token="$(grep -o 'setup?token=[A-Za-z0-9_-]*' install-out.txt | cut -d= -f2)"
          test -n "$token"
          echo "token=$token" >> "$GITHUB_ENV"
          if sudo grep -qF "$token" "$DIR/install.log"; then echo 'Niespełniony warunek'; exit 1; fi
          if sudo grep -q "$(sudo sed -n 's/^SOLARGRAF_DB_PASSWORD=//p' "$DIR/.env")" "$DIR/install.log" install-out.txt; then echo 'Niespełniony warunek'; exit 1; fi
      - name: HTTPS z lokalnego CA, nagłówki, frontend, przekierowanie
        run: |
          ca="$DIR/solargraf-ca.crt"
          curl -fsS --cacert "$ca" https://localhost/api/health/ready
          headers="$(curl -fsS -D - -o /dev/null --cacert "$ca" https://localhost/)"
          echo "$headers" | grep -qi '^content-security-policy:.*frame-ancestors'
          echo "$headers" | grep -qi '^x-content-type-options: nosniff'
          if echo "$headers" | grep -qi '^server:'; then echo 'Niespełniony warunek'; exit 1; fi
          curl -fsS --cacert "$ca" https://localhost/setup | grep -q '<div id="root">'
          curl -fsS --cacert "$ca" https://localhost/login | grep -q '<div id="root">'
          # Wejście po adresie IP z LAN: klient nie wysyła SNI (tak jak przeglądarka).
          addr="$(sudo sed -n 's/^SOLARGRAF_PUBLIC_ADDRESS=//p' "$DIR/.env")"
          echo "Adres w LAN: $addr"
          [[ "$addr" =~ ^[0-9.]+$ ]]
          curl -fsS --cacert "$ca" "https://$addr/api/health/ready"
          curl -fsS --cacert "$ca" "https://$addr/" | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/)" = "308"
          test "$(curl -s -o /dev/null -w '%{http_code}' --cacert "$ca" https://localhost/api/docs)" = "404"
          # Endpointy agenta niedostępne przez proxy (D42) — także z poprawnym kształtem żądania.
          test "$(curl -s -o /dev/null -w '%{http_code}' --cacert "$ca" https://localhost/api/agent/config)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' --cacert "$ca" -X POST -H 'Authorization: Bearer x' https://localhost/api/agent/batches)" = "404"
      - name: Tylko proxy wystawia porty
        run: |
          for svc in db api worker agent; do
            id="$(docker ps -q --filter label=com.docker.compose.project=solargraf --filter "label=com.docker.compose.service=$svc")"
            test -n "$id"
            test -z "$(docker port "$id")"
          done
      - name: Lokalny agent działa bez ręcznej konfiguracji (D43), token tylko w .env
        run: |
          compose() { sudo docker compose -p solargraf -f "$DIR/src/deploy/compose.yaml" --env-file "$DIR/.env" "$@"; }
          agent_token="$(sudo sed -n 's/^SOLARGRAF_AGENT_TOKEN=//p' "$DIR/.env")"
          test -n "$agent_token"
          for i in $(seq 1 30); do
            line="$(compose exec -T api solargraf-admin agent list | grep '^lokalny |' || true)"
            echo "$line"
            if [ -n "$line" ] && ! echo "$line" | grep -q 'heartbeat: nigdy'; then break; fi
            if [ "$i" -eq 30 ]; then compose logs --no-color agent; exit 1; fi
            sleep 2
          done
          test "$(compose exec -T agent id -u)" = "10001"
          compose logs --no-color agent > agent-logs.txt 2>&1
          if grep -qF "$agent_token" agent-logs.txt install-out.txt; then echo 'Niespełniony warunek'; exit 1; fi
          if sudo grep -qF "$agent_token" "$DIR/install.log"; then echo 'Niespełniony warunek'; exit 1; fi
      - name: Pierwsze konto przez link, logowanie z cookie Secure, lista instalacji
        run: |
          ca="$DIR/solargraf-ca.crt"
          body="$(jq -n --arg t "$token" '{token:$t, organization_name:"CI", email:"ci@example.pl", display_name:"CI", password:"ci-instalator-haslo-1"}')"
          test "$(curl -s -o /dev/null -w '%{http_code}' --cacert "$ca" -H 'Content-Type: application/json' -d "$body" https://localhost/api/setup)" = "201"
          curl -fsS --cacert "$ca" -c jar.txt -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.pl","password":"ci-instalator-haslo-1"}' https://localhost/api/auth/login >/dev/null
          grep -q 'sg_session' jar.txt
          test "$(curl -fsS --cacert "$ca" -b jar.txt https://localhost/api/sites)" = "[]"
      - name: Symulator (D45) — symulator → agent → API → baza → status OK, potem off
        run: |
          ca="$DIR/solargraf-ca.crt"
          compose() { sudo docker compose -p solargraf -f "$DIR/src/deploy/compose.yaml" --env-file "$DIR/.env" --profile symulator "$@"; }
          sudo solargraf simulator on | tee sim-on.txt
          grep -q 'adres: simulator, port: 5020' sim-on.txt
          id="$(docker ps -q --filter label=com.docker.compose.project=solargraf --filter label=com.docker.compose.service=simulator)"
          test -n "$id"
          test -z "$(docker port "$id")"
          test "$(compose exec -T simulator id -u)" = "10001"
          csrf="$(curl -fsS --cacert "$ca" -c sim-jar.txt -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.pl","password":"ci-instalator-haslo-1"}' https://localhost/api/auth/login | jq -r .csrf_token)"
          org="$(curl -fsS --cacert "$ca" -b sim-jar.txt https://localhost/api/auth/me | jq -r '.memberships[0].organization_id')"
          site="$(curl -fsS --cacert "$ca" -b sim-jar.txt -H "X-CSRF-Token: $csrf" -H 'Content-Type: application/json' \
            -d "$(jq -n --arg o "$org" '{organization_id:$o, name:"Test symulatora"}')" https://localhost/api/sites | jq -r .id)"
          body='{"name":"Symulator","host":"simulator","port":5020,"device":{"name":"Falownik (SIMULATED)","profile_id":"simulated.hybrid-inverter","profile_version":"0.1.0"}}'
          test "$(curl -s -o /dev/null -w '%{http_code}' --cacert "$ca" -b sim-jar.txt -H "X-CSRF-Token: $csrf" \
            -H 'Content-Type: application/json' -d "$body" "https://localhost/api/sites/$site/connections")" = "201"
          # Agent pobiera konfigurację co 60 s, odczyt co 10 s.
          for i in $(seq 1 36); do
            status="$(curl -fsS --cacert "$ca" -b sim-jar.txt "https://localhost/api/sites/$site/devices" | jq -r '.[0].status')"
            echo "status: $status"
            [ "$status" = "OK" ] && break
            if [ "$i" -eq 36 ]; then compose logs --no-color agent simulator; exit 1; fi
            sleep 5
          done
          simulated="$(compose exec -T db psql -U solargraf -d solargraf -tAc "SELECT count(*) FROM measurements WHERE origin = 'SIMULATED'")"
          other="$(compose exec -T db psql -U solargraf -d solargraf -tAc "SELECT count(*) FROM measurements WHERE origin <> 'SIMULATED'")"
          echo "pomiary SIMULATED: $simulated, inne: $other"
          test "$simulated" -gt 0
          test "$other" = "0"
          # Worker (D46) liczy agregaty co 60 s; historia z API oznacza pochodzenie SIMULATED.
          device="$(curl -fsS --cacert "$ca" -b sim-jar.txt "https://localhost/api/sites/$site/devices" | jq -r '.[0].id')"
          for i in $(seq 1 30); do
            aggregates="$(compose exec -T db psql -U solargraf -d solargraf -tAc "SELECT count(*) FROM aggregates WHERE resolution = '5m'")"
            echo "agregaty 5m: $aggregates"
            [ "$aggregates" -gt 0 ] && break
            if [ "$i" -eq 30 ]; then compose logs --no-color worker; exit 1; fi
            sleep 5
          done
          from="$(date -u -d '-1 hour' +%Y-%m-%dT%H:%M:%SZ)"
          to="$(date -u -d '+5 minutes' +%Y-%m-%dT%H:%M:%SZ)"
          history="$(curl -fsS --cacert "$ca" -b sim-jar.txt -G "https://localhost/api/sites/$site/devices/$device/history" --data-urlencode metric=pv_power --data-urlencode "from=$from" --data-urlencode "to=$to" --data-urlencode resolution=5m)"
          echo "$history" | jq -e '.origins == ["SIMULATED"] and (.points | length) > 0 and ([.points[] | select(.value != null)] | length) > 0'
          sudo solargraf status > sim-status.txt
          grep -q 'Symulator (SIMULATED): włączony' sim-status.txt
          sudo solargraf simulator off
          test -z "$(docker ps -aq --filter label=com.docker.compose.project=solargraf --filter label=com.docker.compose.service=simulator)"
          if sudo grep -q '^SOLARGRAF_SIMULATOR=' "$DIR/.env"; then echo 'Niespełniony warunek'; exit 1; fi
          if sudo solargraf simulator start; then echo 'Niespełniony warunek'; exit 1; fi
      - name: Ponowna instalacja zachowuje sekrety i dane
        run: |
          before="$(sudo sha256sum "$DIR/.env" | cut -d' ' -f1)"
          sudo "$DIR/src/deploy/install.sh" install --yes | tee reinstall-out.txt
          test "$(sudo sha256sum "$DIR/.env" | cut -d' ' -f1)" = "$before"
          grep -q 'już skonfigurowany' reinstall-out.txt
          sudo solargraf status
      - name: Aktualizacja (D65) — manifest, sukces z kopią i sprzątaniem, błąd z powrotem
        run: |
          ca="$DIR/solargraf-ca.crt"
          compose() { sudo docker compose -p solargraf -f "$DIR/src/deploy/compose.yaml" --env-file "$DIR/.env" "$@"; }
          count() { compose exec -T db psql -U solargraf -d solargraf -tAc "$1"; }
          job() { sudo cat "$DIR/run/update-status/status.json"; }
          sites="$(count 'SELECT count(*) FROM sites')"
          test "$sites" -gt 0
          revision="$(count 'SELECT version_num FROM alembic_version')"

          # Podpisany manifest z GitHuba: zainstalowana wersja jest najnowsza.
          sudo solargraf update --yes | tee upd-manifest.txt
          grep -q 'Brak nowszej wersji' upd-manifest.txt
          job | jq -e '.state == "NO_UPDATE" and .finished_at != null'
          sudo find "$DIR/backups" -name '*-pre-update.tar.gz' 2>/dev/null | grep -q . && { echo 'Niespełniony warunek'; exit 1; }

          # --dry-run niczego nie zmienia.
          sudo SOLARGRAF_SOURCE_URL=http://127.0.0.1:8765/src.tar.gz solargraf update --ref main --dry-run | tee upd-dry.txt
          grep -q 'Tryb --dry-run' upd-dry.txt
          sudo test ! -e "$DIR/src.previous"

          # Osierocone obrazy: z etykietą produktu (usuwany) i obcy bez etykiety (zostaje).
          # Druga budowa pod tą samą nazwą zostawia pierwszą jako <none>.
          orphan() {
            echo 'FROM postgres:18-trixie' | docker build -q "$@" - >/dev/null
          }
          orphan --label com.solargraf.product=solargraf --label ci.orphan=ours -t ci-orphan-ours:x
          orphan --label com.solargraf.product=solargraf --label ci.orphan=ours2 -t ci-orphan-ours:x
          orphan --label ci.orphan=other -t ci-orphan-other:x
          orphan --label ci.orphan=other2 -t ci-orphan-other:x
          ours="$(docker images -q --filter dangling=true --filter label=ci.orphan=ours)"
          other="$(docker images -q --filter dangling=true --filter label=ci.orphan=other)"
          test -n "$ours" && test -n "$other"
          grep -q 'raport odzyskanego miejsca' upd-dry.txt

          # Udana aktualizacja (ten sam kod): kopia pre-update, poprzednia wersja zachowana, dane bez zmian.
          sudo SOLARGRAF_SOURCE_URL=http://127.0.0.1:8765/src.tar.gz solargraf update --ref main --yes | tee upd-ok.txt
          grep -q 'Zaktualizowano solargraf' upd-ok.txt
          grep -q 'Sprzątanie' upd-ok.txt
          grep -qE 'Sprzątanie: odzyskano [0-9]+ MB \(wolne w /var/lib: [0-9]+ → [0-9]+ MB\)' upd-ok.txt
          if docker image inspect "$ours" >/dev/null 2>&1; then echo 'Niespełniony warunek'; exit 1; fi
          docker image inspect "$other" >/dev/null
          version="$(grep -oE '^__version__ = "[0-9]+\.[0-9]+\.[0-9]+"' server/src/solargraf_server/__init__.py | cut -d'"' -f2)"
          job | jq -e --arg v "$version" '.state == "SUCCESS" and .step == "DONE" and .from_version == $v and .to_version == $v'
          sudo find "$DIR/backups" -name '*-pre-update.tar.gz' | grep -q .
          sudo test -f "$DIR/src.previous/deploy/compose.yaml"
          docker image inspect solargraf-api:previous >/dev/null
          curl -fsS --cacert "$ca" https://localhost/api/health/ready
          test "$(count 'SELECT count(*) FROM sites')" = "$sites"
          test "$(readlink -f /usr/local/bin/solargraf)" = "$DIR/src/deploy/install.sh"
          # Obniżenie wersji jest odrzucane przed zmianą czegokolwiek.
          mkdir -p /tmp/old && tar -xzf /tmp/srv/src.tar.gz -C /tmp/old
          sed -i 's/^__version__ = .*/__version__ = "0.0.1"/' /tmp/old/solargraf-main/server/src/solargraf_server/__init__.py
          tar -C /tmp/old -czf /tmp/srv/old.tar.gz solargraf-main
          if sudo SOLARGRAF_SOURCE_URL=http://127.0.0.1:8765/old.tar.gz solargraf update --ref old --yes 2>upd-old.txt; then echo 'Niespełniony warunek'; exit 1; fi
          grep -q 'starsza niż zainstalowana' upd-old.txt

          # Nieudana aktualizacja: migracja zmienia bazę, a API nie startuje → powrót kodu, obrazów i bazy.
          mkdir -p /tmp/bad && tar -xzf /tmp/srv/src.tar.gz -C /tmp/bad
          bad=/tmp/bad/solargraf-main
          printf '%s\n' '"""Tylko test CI: migracja przed nieudanym startem."""' 'import sqlalchemy as sa' 'from alembic import op' \
            'revision: str = "ci_update_fail"' "down_revision: str | None = \"$revision\"" 'branch_labels = None' 'depends_on = None' \
            'def upgrade() -> None:' '    op.create_table("ci_update_marker", sa.Column("id", sa.Integer(), primary_key=True))' \
            'def downgrade() -> None:' '    op.drop_table("ci_update_marker")' > "$bad/server/alembic/versions/9999_ci_update_fail.py"
          sed -i '/^  api:$/,/^  worker:$/ s/^    image: solargraf-api:local$/&\n    entrypoint: ["false"]/' "$bad/deploy/compose.yaml"
          grep -q 'entrypoint: \["false"\]' "$bad/deploy/compose.yaml"
          tar -C /tmp/bad -czf /tmp/srv/bad.tar.gz solargraf-main
          if sudo SOLARGRAF_HEALTH_TIMEOUT_S=60 SOLARGRAF_SOURCE_URL=http://127.0.0.1:8765/bad.tar.gz solargraf update --ref bad --yes | tee upd-bad.txt; then echo 'Niespełniony warunek'; exit 1; fi
          grep -q 'przywracam wersję' upd-bad.txt
          grep -q 'Migracje zmieniły bazę' upd-bad.txt
          grep -q 'aplikacja działa' upd-bad.txt
          job | jq -e '.state == "ROLLED_BACK"'
          sudo test ! -e "$DIR/src/server/alembic/versions/9999_ci_update_fail.py"
          if sudo grep -q 'entrypoint' "$DIR/src/deploy/compose.yaml"; then echo 'Niespełniony warunek'; exit 1; fi
          test "$(count 'SELECT version_num FROM alembic_version')" = "$revision"
          test "$(count "SELECT count(*) FROM information_schema.tables WHERE table_name = 'ci_update_marker'")" = "0"
          test "$(count 'SELECT count(*) FROM sites')" = "$sites"
          curl -fsS --cacert "$ca" https://localhost/api/health/ready
          # Agent działa po powrocie (heartbeat po aktualizacji).
          after="$(date -u +%s)"
          for i in $(seq 1 45); do
            beat="$(count "SELECT coalesce(extract(epoch FROM max(last_heartbeat_at))::bigint, 0) FROM agents")"
            [ "$beat" -ge "$after" ] && break
            if [ "$i" -eq 45 ]; then compose logs --no-color agent; exit 1; fi
            sleep 2
          done
      - name: Aktualizacja zlecona w aplikacji (D65) — flaga z kontenera API, usługa systemd, stan w API
        run: |
          ca="$DIR/solargraf-ca.crt"
          compose() { sudo docker compose -p solargraf -f "$DIR/src/deploy/compose.yaml" --env-file "$DIR/.env" "$@"; }
          systemctl is-enabled solargraf-update.path
          test "$(sudo stat -c '%u %a' "$DIR/run/update-request")" = "10001 700"
          test "$(sudo stat -c '%u %a' "$DIR/run/update-status")" = "0 755"
          # API nie zapisze stanu (montowanie tylko do odczytu).
          if compose exec -T api python -c "open('/run/solargraf/update-status/x', 'w')"; then echo 'Niespełniony warunek'; exit 1; fi
          csrf="$(curl -fsS --cacert "$ca" -c ui-jar.txt -H 'Content-Type: application/json'             -d '{"email":"ci@example.pl","password":"ci-instalator-haslo-1"}' https://localhost/api/auth/login | jq -r .csrf_token)"
          curl -fsS --cacert "$ca" -b ui-jar.txt https://localhost/api/system/updates | jq -e '.install.supported == true and .install.running == false'
          # Brak nowszej wersji — endpoint odmawia, flaga nie powstaje.
          test "$(curl -s -o /dev/null -w '%{http_code}' --cacert "$ca" -b ui-jar.txt -H "X-CSRF-Token: $csrf"             -H 'Content-Type: application/json' -d '{"version":"99.0.0"}' https://localhost/api/system/updates/install)" = "409"
          sudo test ! -e "$DIR/run/update-request/update"
          # Flaga zapisana przez użytkownika API uruchamia usługę hosta; ta sprawdza manifest i zapisuje stan.
          before="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          compose exec -T api python -c "open('/run/solargraf/update-request/update', 'x').close()"
          for i in $(seq 1 60); do
            state="$(sudo cat "$DIR/run/update-status/status.json" | jq -r --arg b "$before" 'select(.started_at >= $b) | .state')"
            echo "stan: ${state:-?}"
            [ "$state" = "NO_UPDATE" ] && break
            if [ "$i" -eq 60 ]; then sudo journalctl -u solargraf-update.service --no-pager | tail -50; exit 1; fi
            sleep 2
          done
          sudo test ! -e "$DIR/run/update-request/update"
          curl -fsS --cacert "$ca" -b ui-jar.txt https://localhost/api/system/updates | jq -e '.install.last.state == "NO_UPDATE" and .install.requested == false'
          sudo journalctl -u solargraf-update.service --no-pager | grep -q 'Brak nowszej wersji'
      - name: Kopia automatyczna (D62) — timer systemd i retencja 7 kopii
        run: |
          systemctl is-enabled solargraf-backup.timer
          sudo solargraf status | tee status-out.txt
          grep -q 'Kopia automatyczna: włączona' status-out.txt
          # Stare kopie automatyczne (puste pliki z wcześniejszą datą w nazwie) — retencja je usuwa.
          sudo install -d -m 700 "$DIR/backups"
          for i in 1 2 3 4 5 6 7 8; do sudo touch "$DIR/backups/solargraf-backup-2000010${i}T000000Z-auto.tar.gz"; done
          sudo touch "$DIR/backups/solargraf-backup-20000101T000000Z-manual.tar.gz"
          sudo systemctl start solargraf-backup.service
          test "$(sudo find "$DIR/backups" -name '*-auto.tar.gz' | wc -l)" = "7"
          sudo test -f "$DIR/backups/solargraf-backup-20000101T000000Z-manual.tar.gz"
          sudo find "$DIR/backups" -name '*-auto.tar.gz' -size +0 | grep -q .
          sudo rm -f "$DIR"/backups/solargraf-backup-2000*
          sudo rm -f "$DIR"/backups/*-auto.tar.gz
      - name: Backup → uninstall --purge → instalacja → restore (D62)
        run: |
          ca="$DIR/solargraf-ca.crt"
          compose() { sudo docker compose -p solargraf -f "$DIR/src/deploy/compose.yaml" --env-file "$DIR/.env" "$@"; }
          count() { compose exec -T db psql -U solargraf -d solargraf -tAc "$1"; }
          measurements="$(count 'SELECT count(*) FROM measurements')"
          test "$measurements" -gt 0
          env_before="$(sudo grep -v -e '^SOLARGRAF_SITE_ADDRESSES=' -e '^SOLARGRAF_PUBLIC_ADDRESS=' "$DIR/.env" | sha256sum)"
          ca_before="$(sha256sum < "$ca")"
          sudo solargraf backup | tee backup-out.txt
          file="$(sed -n 's/^Kopia zapasowa: //p' backup-out.txt)"
          test -n "$file"
          test "$(sudo stat -c %a "$file")" = "600"
          test "$(sudo stat -c %a "$DIR/backups")" = "700"
          sudo tar -tzf "$file" | LC_ALL=C sort | tr '\n' ' ' | grep -qx 'SHA256SUMS caddy-pki.tar db.dump env manifest.txt '
          sudo tar -xzOf "$file" manifest.txt | grep -qx 'db_revision=[0-9a-z_]*'
          # Sekrety nie trafiają na ekran ani do logu.
          password="$(sudo sed -n 's/^SOLARGRAF_DB_PASSWORD=//p' "$DIR/.env")"
          if grep -qF "$password" backup-out.txt || sudo grep -qF "$password" "$DIR/install.log"; then echo 'Niespełniony warunek'; exit 1; fi

          # Uszkodzona kopia i kopia z nowszej wersji są odrzucane przed zmianą czegokolwiek.
          work="$(mktemp -d)"
          sudo tar -xzf "$file" -C "$work"
          sudo sed -i 's/^db_revision=.*/db_revision=9999/' "$work/manifest.txt"
          sudo tar -C "$work" -czf /tmp/bad-sum.tar.gz db.dump env caddy-pki.tar manifest.txt SHA256SUMS
          if sudo solargraf restore /tmp/bad-sum.tar.gz --yes 2>restore-err.txt; then echo 'Niespełniony warunek'; exit 1; fi
          grep -q 'Sumy kontrolne' restore-err.txt
          (cd "$work" && sudo sh -c 'sha256sum db.dump env caddy-pki.tar manifest.txt > SHA256SUMS')
          sudo tar -C "$work" -czf /tmp/newer.tar.gz db.dump env caddy-pki.tar manifest.txt SHA256SUMS
          if sudo solargraf restore /tmp/newer.tar.gz --yes 2>restore-err.txt; then echo 'Niespełniony warunek'; exit 1; fi
          grep -q 'nowszej wersji' restore-err.txt
          test "$(count 'SELECT count(*) FROM measurements')" -ge "$measurements"

          # Utrata danych: pełne usunięcie, kopie zostają.
          sudo solargraf uninstall --purge --yes
          if docker volume inspect solargraf_db-data >/dev/null 2>&1; then echo 'Niespełniony warunek'; exit 1; fi
          sudo test -f "$file"
          sudo test ! -e "$DIR/.env"
          sudo test ! -e "$DIR/src"
          sudo /tmp/bundle/solargraf/deploy/install.sh install --yes | tee fresh-out.txt
          grep -q 'setup?token=' fresh-out.txt
          test "$(count 'SELECT count(*) FROM users')" = "0"

          sudo solargraf restore "$file" --yes | tee restore-out.txt
          grep -q 'Odtworzono kopię' restore-out.txt
          sudo find "$DIR/backups" -name '*-pre-restore.tar.gz' | grep -q .
          test "$(sudo grep -v -e '^SOLARGRAF_SITE_ADDRESSES=' -e '^SOLARGRAF_PUBLIC_ADDRESS=' "$DIR/.env" | sha256sum)" = "$env_before"
          test "$(sudo stat -c %a "$DIR/.env")" = "600"
          test "$(count 'SELECT count(*) FROM measurements')" -ge "$measurements"
          # To samo CA: certyfikat zaimportowany wcześniej w przeglądarce dalej działa.
          test "$(sha256sum < "$ca")" = "$ca_before"
          curl -fsS --cacert "$ca" https://localhost/api/health/ready
          curl -fsS --cacert "$ca" -c restore-jar.txt -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.pl","password":"ci-instalator-haslo-1"}' https://localhost/api/auth/login >/dev/null
          curl -fsS --cacert "$ca" -b restore-jar.txt https://localhost/api/sites | jq -e 'map(.name) | index("Test symulatora") != null'
          # Agent działa z odtworzonym tokenem (heartbeat po odtworzeniu).
          restored_at="$(date -u +%s)"
          for i in $(seq 1 45); do
            beat="$(count "SELECT coalesce(extract(epoch FROM max(last_heartbeat_at))::bigint, 0) FROM agents")"
            [ "$beat" -ge "$restored_at" ] && break
            if [ "$i" -eq 45 ]; then compose logs --no-color agent; exit 1; fi
            sleep 2
          done
      - name: uninstall zostawia dane, --purge je usuwa
        run: |
          sudo solargraf uninstall --yes
          test -z "$(docker ps -aq --filter label=com.docker.compose.project=solargraf)"
          docker volume inspect solargraf_db-data >/dev/null
          sudo test -f "$DIR/.env"
          test ! -e /usr/local/bin/solargraf
          sudo "$DIR/src/deploy/install.sh" uninstall --purge --yes
          if docker volume inspect solargraf_db-data >/dev/null 2>&1; then echo 'Niespełniony warunek'; exit 1; fi
          if systemctl is-enabled solargraf-backup.timer 2>/dev/null; then echo 'Niespełniony warunek'; exit 1; fi
          if systemctl is-enabled solargraf-update.path 2>/dev/null; then echo 'Niespełniony warunek'; exit 1; fi
          # Kopie zapasowe zostają (D17, D62); bez nich znika cały katalog.
          sudo test ! -e "$DIR/src"
          sudo test ! -e "$DIR/.env"
          sudo find "$DIR" -mindepth 1 -maxdepth 1 ! -name backups | wc -l | grep -qx 0
          sudo rm -rf "$DIR/backups"
      - name: Logi
        if: failure()
        run: sudo docker compose -p solargraf -f "$DIR/src/deploy/compose.yaml" --env-file "$DIR/.env" logs --no-color || true
