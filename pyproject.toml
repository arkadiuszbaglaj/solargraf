# Root workspace (wirtualny) — nie jest dystrybuowany.
[project]
name = "solargraf-workspace"
version = "0.10.1"
requires-python = ">=3.12,<3.13"
dependencies = ["solargraf-server", "solargraf-agent", "solargraf-profiles", "solargraf-simulator"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["server", "agent", "profiles-schema", "simulator"]

[tool.uv.sources]
solargraf-server = { workspace = true }
solargraf-agent = { workspace = true }
solargraf-profiles = { workspace = true }
solargraf-simulator = { workspace = true }

# Narzędzia deweloperskie — nie trafiają do obrazów produktu.
[dependency-groups]
dev = [
    "cyclonedx-bom>=8.0.1",
    "httpx2>=2.16.0",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["server/src", "agent/src", "profiles-schema/src", "simulator/src", "tools"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "C4", "SIM", "RUF", "ANN", "ASYNC", "PT"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]  # stałe hasła testowe

[tool.mypy]
strict = true
python_version = "3.12"
files = ["server/src", "server/tests", "server/alembic", "agent/src", "agent/tests", "profiles-schema/src",
         "profiles-schema/tests", "simulator/src", "simulator/tests", "tools"]
explicit_package_bases = true
mypy_path = ["server/src", "agent/src", "profiles-schema/src", "simulator/src", "."]

[tool.pytest.ini_options]
testpaths = ["server/tests", "agent/tests", "profiles-schema/tests", "simulator/tests", "tools/tests"]
addopts = "--import-mode=importlib -ra --strict-markers"
