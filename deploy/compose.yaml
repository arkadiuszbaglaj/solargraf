# Produkcja (D34, D43, D46): db + migrate + api + worker + proxy + agent. Uruchamia instalator
# deploy/install.sh, który tworzy plik .env (sekrety, uprawnienia 600) w katalogu instalacji.
# Na hosta wystawione tylko proxy (80 → przekierowanie, 443). Baza, API i agent tylko w sieci
# Compose; agent łączy się z urządzeniami w LAN przez sieć mostkową Dockera.
# Opcjonalny symulator (D45, profil `symulator`) włącza `sudo solargraf simulator on`.
name: solargraf

x-db-env: &db-env
  SOLARGRAF_DB_HOST: db
  SOLARGRAF_DB_PORT: "5432"
  SOLARGRAF_DB_NAME: solargraf
  SOLARGRAF_DB_USER: solargraf
  SOLARGRAF_DB_PASSWORD: ${SOLARGRAF_DB_PASSWORD:?Brak SOLARGRAF_DB_PASSWORD w .env}

# Sprawdzanie aktualizacji (D63): wartość początkowa z instalatora (--no-update-check).
x-update-env: &update-env
  SOLARGRAF_UPDATE_CHECK: ${SOLARGRAF_UPDATE_CHECK:-true}

x-hardening: &hardening
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

x-labels: &labels
  com.solargraf.product: solargraf

services:
  db:
    image: postgres:18-trixie
    labels: *labels
    environment:
      POSTGRES_DB: solargraf
      POSTGRES_USER: solargraf
      POSTGRES_PASSWORD: ${SOLARGRAF_DB_PASSWORD:?Brak SOLARGRAF_DB_PASSWORD w .env}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solargraf -d solargraf"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: solargraf-api:local
    labels: *labels
    command: ["alembic", "upgrade", "head"]
    environment: *db-env
    <<: *hardening
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: solargraf-api:local
    labels: *labels
    environment:
      <<: [*db-env, *update-env]
    <<: *hardening
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Agregaty (D46): ten sam obraz co API, bez portów i bez dostępu do urządzeń.
  worker:
    image: solargraf-api:local
    labels: *labels
    command: ["solargraf-worker"]
    environment:
      <<: [*db-env, *update-env]
      # Retencja (D49); puste = domyślne 90 dni / 2 lata / 90 dni.
      SOLARGRAF_RETENTION_RAW_DAYS: ${SOLARGRAF_RETENTION_RAW_DAYS:-90}
      SOLARGRAF_RETENTION_M5_DAYS: ${SOLARGRAF_RETENTION_M5_DAYS:-730}
      SOLARGRAF_RETENTION_RUNS_DAYS: ${SOLARGRAF_RETENTION_RUNS_DAYS:-90}
      # Monitor serwera (D60): składniki sprawdzane w sieci Compose, bez gniazda Dockera.
      SOLARGRAF_MONITOR_API_URL: http://api:8000/api/health/ready
      SOLARGRAF_MONITOR_PROXY_ADDRESS: proxy:443
      SOLARGRAF_RETENTION_ALARMS_DAYS: ${SOLARGRAF_RETENTION_ALARMS_DAYS:-365}
    <<: *hardening
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  proxy:
    build:
      context: ..
      dockerfile: deploy/proxy/Dockerfile
    image: solargraf-proxy:local
    labels: *labels
    environment:
      SOLARGRAF_SITE_ADDRESSES: ${SOLARGRAF_SITE_ADDRESSES:?Brak SOLARGRAF_SITE_ADDRESSES w .env}
      SOLARGRAF_PUBLIC_ADDRESS: ${SOLARGRAF_PUBLIC_ADDRESS:-localhost}
    <<: *hardening
    cap_add: [NET_BIND_SERVICE]
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  agent:
    build:
      context: ..
      dockerfile: agent/Dockerfile
    image: solargraf-agent:local
    labels: *labels
    environment:
      SOLARGRAF_API_URL: http://api:8000
      # Pusty do czasu, aż instalator utworzy agenta i zapisze token w .env.
      SOLARGRAF_AGENT_TOKEN: ${SOLARGRAF_AGENT_TOKEN:-}
    <<: *hardening
    volumes:
      - agent-buffer:/var/lib/solargraf-agent
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Tylko do testów — dane SIMULATED (D45). Bez portu na hoście; agent: simulator:5020.
  simulator:
    profiles: [symulator]
    build:
      context: ..
      dockerfile: simulator/Dockerfile
    image: solargraf-simulator:local
    labels: *labels
    <<: *hardening
    restart: unless-stopped

volumes:
  db-data:
    labels: *labels
  caddy-data:
    labels: *labels
  caddy-config:
    labels: *labels
  agent-buffer:
    labels: *labels
